# LuggageLink Operations Console
# Cloudflare Worker Configuration

name = 'luggster-ops'
main = "src/index.ts"
compatibility_date = "2024-01-01"
compatibility_flags = ["nodejs_compat"]

# Logs
[observability]
[observability.logs]
enabled = true
invocation_logs = true

# Secrets (set via: wrangler secret put DATABASE_URL)
# - DATABASE_URL: Neon PostgreSQL connection string
# - JWT_SECRET: Secret key for JWT signing (generate with: openssl rand -base64 32)

# Environment-specific configuration
[env.staging]
name = "luggster-ops-staging"

[env.production]
name = "luggster-ops"
# Production vars should be set via secrets only
# ADMIN_PIN should be a strong secret in production
