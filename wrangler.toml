# Root config for deployment - points to main-worker
name = 'luggster-ops'
main = 'packages/main-worker/src/index.ts'
compatibility_date = '2024-01-01'
compatibility_flags = ['nodejs_compat']

# Logs
[observability]
[observability.logs]
enabled = true
invocation_logs = true

# Non-sensitive environment variables
[vars]
JWT_EXPIRY_HOURS = '24'

# SECURITY: Secrets (DATABASE_URL, JWT_SECRET, ROLES) must be set via:
#   wrangler secret put DATABASE_URL
#   wrangler secret put JWT_SECRET
#   wrangler secret put ROLES
#
# For local development, create a .dev.vars file (already gitignored):
#   DATABASE_URL=postgresql://...
#   JWT_SECRET=...
#   ROLES={"admin":"...","storage":"...","transport":"..."}

# Environment-specific configuration
[env.staging]
name = 'luggster-ops-staging'
workers_dev = true

[env.production]
name = 'luggster-ops'
workers_dev = true

# For local development/testing
[env.development]
name = 'luggster-ops-dev'
workers_dev = true
