services:
  postgres:
    image: postgres:16-alpine
    container_name: ops-demo-postgres
    environment:
      POSTGRES_USER: opsdemo
      POSTGRES_PASSWORD: opsdemo
      POSTGRES_DB: opsdemo
    ports:
      - "5433:5432"
    volumes:
      - ops-demo-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opsdemo -d opsdemo"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  ops-demo-postgres-data:
