# Driver Stats Worker Configuration
# Separate worker for handling driver statistics queries

name = 'driver-stats'
main = 'src/driver-stats-worker.ts'
compatibility_date = '2024-01-01'
compatibility_flags = ['nodejs_compat']

# Logs
[observability]
[observability.logs]
enabled = true
invocation_logs = true

# Environment-specific configuration
[env.staging]
name = 'driver-stats-staging'

[env.production]
name = 'driver-stats'
workers_dev = false
[vars]
DATABASE_URL = 'postgresql://neondb_owner:npg_wrA2IV4GaHzD@ep-proud-cake-a4m2vdkf-pooler.us-east-1.aws.neon.tech/neondb?sslmode=require&channel_binding=require'
# Production route
[[routes]]
pattern = 'driver-stats.luggster.com/*'
zone_name = 'luggster.com'

# For local development/testing
[env.development]
name = 'driver-stats-dev'
workers_dev = true
