<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Driver Performance - LuggageLink Ops</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: { extend: { colors: {
        koda: { base:'#141210', panel:'#1e1a15', line:'#322a1f', gold:'#ffb000', golddim:'#8a6a1f', red:'#e2472f', cream:'#f4efe6', ink:'#1a1713', mute:'#9a8f7d' }
      }, fontFamily: {
        sans: ['"Space Grotesk"','sans-serif'], mono: ['"Space Mono"','monospace']
      } } }
    }
  </script>
  <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    body { font-family:'Space Grotesk',sans-serif; background:#141210; }
    body::after { content:''; position:fixed; inset:0; pointer-events:none; z-index:9999; background:repeating-linear-gradient(0deg, rgba(255,255,255,.025) 0 1px, transparent 1px 3px); }
    body::before { content:''; position:fixed; inset:0; pointer-events:none; z-index:9998; background:radial-gradient(ellipse at center, transparent 55%, rgba(20,18,16,.55) 100%); }
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: #141210; }
    ::-webkit-scrollbar-thumb { background: #322a1f; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #8a6a1f; }
    .stat-num { font-family:'Space Mono',monospace; font-variant-numeric:tabular-nums; }
    .micro-label { letter-spacing:.15em; text-transform:uppercase; }
    .wordmark { text-shadow:0 0 12px rgba(255,176,0,.35); }
    #driver-stats-grid::-webkit-scrollbar { height: 6px; }
    .stat-card { transition: all 0.2s ease; }
    .stat-card:hover { transform: translateY(-2px); box-shadow: 0 8px 22px rgba(0,0,0,.65); }
    .driver-card { transition: all 0.3s ease; }
    .driver-card:hover { transform: translateY(-2px); }
    .polaroid-card { transition: all 0.3s ease; }
    .polaroid-card:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(0,0,0,.6); }
    /* Navigation active state */
    .nav-link.active {
      background: #322a1f;
      color: #ffb000;
    }
    /* ── decorative flourishes (purely ornamental) ── */
    body { padding-bottom: 26px; }
    /* film sprocket strip along the bottom edge */
    html::after { content:''; position:fixed; left:0; right:0; bottom:0; height:16px; pointer-events:none; z-index:9996;
      background:#0c0a08; border-top:1px solid #322a1f;
      background-image:radial-gradient(circle at 12px 8px, #1e1a15 3px, transparent 3.6px); background-size:26px 16px; }
    /* polaroid spectrum stripes — bottom-left corner chip */
    html::before { content:''; position:fixed; left:18px; bottom:28px; width:104px; height:42px; pointer-events:none; z-index:9996;
      border-radius:5px; opacity:.85; box-shadow:0 4px 12px rgba(0,0,0,.5), inset 0 0 0 1px rgba(255,255,255,.08);
      background:repeating-linear-gradient(135deg,
        #e2472f 0 9px, #eb7532 9px 18px, #f7d038 18px 27px,
        #7fb069 27px 36px, #34bbe6 36px 45px, #4355db 45px 54px); }
    /* blinking terminal cursor on the wordmark */
    h1::after { content:'▮'; margin-left:3px; font-size:.75em; color:#ffb000; animation:blink 1.2s steps(1) infinite; }
    @keyframes blink { 50% { opacity:0; } }
    /* gold underline sweep on nav links */
    .nav-link { position:relative; }
    .nav-link::after { content:''; position:absolute; left:12px; right:12px; bottom:5px; height:2px; background:#ffb000; opacity:.85; transform:scaleX(0); transform-origin:left; transition:transform .25s ease; }
    .nav-link:hover::after, .nav-link.active::after { transform:scaleX(1); }
    /* playful polaroid tilt — straightens on hover/active */
    .stat-card:nth-child(odd) { transform:rotate(-.6deg); }
    .stat-card:nth-child(even) { transform:rotate(.6deg); }
    .stat-card:hover, .stat-card.active { transform:rotate(0deg) translateY(-2px); }
  </style>
</head>
<body class="bg-koda-base text-koda-cream min-h-screen"><nav class="bg-koda-panel border-b border-koda-line px-6 py-4 sticky top-0 z-50 shadow-md">
    <div class="max-w-7xl mx-auto flex justify-between items-center">
      <div class="flex items-center gap-3">
        <div class="bg-koda-gold text-koda-ink p-2.5 rounded-full shadow-inner shadow-koda-gold/20">

        </div>
        <div>
          <h1 class="text-xl font-bold tracking-tight">Driver Performance</h1>
          <div class="flex items-center gap-2">
            <span id="status-indicator" class="w-2 h-2 rounded-full bg-amber-500 animate-pulse"></span>

      </div>
      <div class="flex items-center gap-2">
        <!-- Navigation Links -->

          <span class="hidden sm:inline text-sm font-medium">Shipments</span>
        </a>
        <a href="/storage" id="nav-storage" class="nav-link px-4 py-2 rounded-lg text-koda-mute hover:text-koda-gold hover:bg-koda-line transition-all flex items-center gap-2">
          <i data-lucide="warehouse" class="w-4 h-4"></i>
          <span class="hidden sm:inline text-sm font-medium">Storage</span>
        </a>
        <a href="/drivers" id="nav-drivers" class="nav-link active px-4 py-2 rounded-lg text-koda-gold bg-koda-line transition-all flex items-center gap-2">
          <i data-lucide="users" class="w-4 h-4"></i>
          <span class="hidden sm:inline text-sm font-medium">Drivers</span>

    </div>
  </nav>

  <div class="max-w-7xl mx-auto p-6 space-y-6">
    <div id="toast-container" class="fixed top-24 right-6 z-50"></div>
    
    <!-- Stats Cards -->
    <div class="flex gap-4 overflow-x-auto pb-2 snap-x snap-mandatory" id="driver-stats-grid">
      <div class="bg-koda-panel h-24 w-[150px] flex-none rounded-md animate-pulse"></div>
      <div class="bg-koda-panel h-24 w-[150px] flex-none rounded-md animate-pulse"></div>
      <div class="bg-koda-panel h-24 w-[150px] flex-none rounded-md animate-pulse"></div>
      <div class="bg-koda-panel h-24 w-[150px] flex-none rounded-md animate-pulse"></div>
    </div>
    
    <!-- Controls Bar -->
    <div class="bg-koda-panel rounded-xl p-4 border border-koda-line flex flex-wrap gap-4 items-center justify-between">
      <div class="flex items-center gap-4">
        <!-- Search -->
        <div class="relative">
          <i data-lucide="search" class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-koda-mute"></i>
          <input 
            type="text" 
            id="searchInput" 
            placeholder="Search drivers..." 
            oninput="applySortAndFilter()"
            class="bg-koda-base border border-koda-line text-koda-cream text-sm rounded-lg pl-9 pr-3 py-2 w-56 focus:border-koda-gold outline-none placeholder:text-koda-mute"
          >
        </div>
        
        <!-- Sort -->
        <div class="flex items-center gap-2">
          <i data-lucide="arrow-up-down" class="w-4 h-4 text-koda-mute"></i>
          <select id="sort-select" onchange="applySortAndFilter()" class="bg-koda-base text-koda-cream text-sm rounded-lg px-3 py-2 border border-koda-line focus:border-koda-gold outline-none cursor-pointer">
            <option value="deliveries-desc">Most Deliveries</option>
            <option value="deliveries-asc">Least Deliveries</option>
            <option value="revenue-desc">Highest Revenue</option>
            <option value="revenue-asc">Lowest Revenue</option>
            <option value="success-desc">Best Success Rate</option>
            <option value="success-asc">Worst Success Rate</option>
            <option value="cancel-desc">Highest Cancel Rate</option>
            <option value="cancel-asc">Lowest Cancel Rate</option>
            <option value="active-recent">Recently Active</option>
            <option value="active-oldest">Inactive Longest</option>
          </select>
        </div>
        
        <!-- Filter -->
        <div class="flex items-center gap-2">
          <i data-lucide="filter" class="w-4 h-4 text-koda-mute"></i>
          <select id="filter-select" onchange="applySortAndFilter()" class="bg-koda-base text-koda-cream text-sm rounded-lg px-3 py-2 border border-koda-line focus:border-koda-gold outline-none cursor-pointer">
            <option value="all">All Drivers</option>
            <option value="online">Online Only</option>
            <option value="offline">Offline Only</option>
            <option value="high-performers">High Performers</option>
            <option value="needs-attention">Needs Attention</option>
          </select>
        </div>
      </div>
      
      <div class="flex items-center gap-3">
        <!-- Auto-refresh Toggle -->
        <button onclick="toggleAutoRefresh()" id="btn-auto-refresh" class="flex items-center gap-2 bg-koda-gold text-koda-ink hover:brightness-110 px-3 py-2 rounded-lg text-sm font-medium transition-colors" title="Automatically refresh data every 30 seconds">
          <i data-lucide="zap" class="w-4 h-4"></i>
          <span>Live:</span>
          <span id="auto-refresh-status">On</span>
        </button>
        
        <!-- Last Updated -->
        <div class="flex items-center gap-2 text-xs text-koda-mute">
          <i data-lucide="clock" class="w-3 h-3"></i>
          <span id="last-updated">Loading...</span>
        </div>
      </div>
    </div>

    <!-- Combined Earnings Report Section -->
    <div class="bg-koda-panel rounded-xl shadow-lg border border-koda-line p-6">
      <div class="flex items-center justify-between mb-4">
        <h3 class="text-lg font-bold text-koda-cream flex items-center gap-2">
          <i data-lucide="trending-up" class="w-5 h-5 text-koda-gold"></i> Combined Earnings Report
        </h3>
        <div class="flex items-center gap-2">
          <select id="earnings-report-type" onchange="loadEarningsReport()" class="bg-koda-base border border-koda-line text-koda-cream text-xs rounded-lg px-3 py-2 focus:border-koda-gold outline-none">
            <option value="monthly">Monthly</option>
            <option value="quarterly">Quarterly</option>
            <option value="yearly">Yearly</option>
          </select>
          <button onclick="downloadEarningsReport('xlsx')" class="bg-koda-gold text-koda-ink hover:brightness-110 px-3 py-2 rounded-lg text-xs font-medium transition-all flex items-center gap-1">
            <i data-lucide="download" class="w-3 h-3"></i> Download Excel
          </button>
        </div>
      </div>
      
      <!-- Earnings Summary Cards -->
      <div class="grid grid-cols-2 md:grid-cols-4 gap-3 mb-4" id="earnings-summary">
        <div class="bg-koda-base/50 rounded-lg p-3 border border-koda-line">
          <div class="text-xs text-koda-mute">Total Revenue</div>
          <div class="text-lg font-bold text-koda-gold" id="total-revenue">$0.00</div>
        </div>
        <div class="bg-koda-base/50 rounded-lg p-3 border border-koda-line">
          <div class="text-xs text-koda-mute">Transport Revenue</div>
          <div class="text-lg font-bold text-blue-400" id="transport-revenue">$0.00</div>
        </div>
        <div class="bg-koda-base/50 rounded-lg p-3 border border-koda-line">
          <div class="text-xs text-koda-mute">Storage Revenue</div>
          <div class="text-lg font-bold text-amber-400" id="storage-revenue">$0.00</div>
        </div>
        <div class="bg-koda-base/50 rounded-lg p-3 border border-koda-line">
          <div class="text-xs text-koda-mute">Total Orders</div>
          <div class="text-lg font-bold text-koda-cream" id="total-orders">0</div>
        </div>
      </div>
      
      <!-- Earnings Table -->
      <div class="overflow-x-auto">
        <table class="w-full text-sm">
          <thead>
            <tr class="border-b border-koda-line text-koda-mute text-xs uppercase">
              <th class="text-left py-2 px-3">Period</th>
              <th class="text-right py-2 px-3">Transport</th>
              <th class="text-right py-2 px-3">Storage</th>
              <th class="text-right py-2 px-3">Total Revenue</th>
              <th class="text-right py-2 px-3">Orders</th>
            </tr>
          </thead>
          <tbody id="earnings-table-body" class="text-koda-cream">

              <td colspan="5" class="text-center py-4 text-koda-mute">Select a report type to load earnings data</td>

    <!-- Export & Reports Section -->
    <div class="bg-koda-panel rounded-xl shadow-lg border border-koda-line p-6">
      <div class="flex items-center justify-between mb-4">
        <h3 class="text-lg font-bold text-koda-cream flex items-center gap-2">
          <i data-lucide="file-spreadsheet" class="w-5 h-5 text-koda-gold"></i> Reports & Exports
        </h3>
        <div class="flex items-center gap-2">
          <select id="export-period" class="bg-koda-base border border-koda-line text-koda-cream text-xs rounded-lg px-3 py-2 focus:border-koda-gold outline-none">
            <option value="weekly">Last 7 Days</option>
            <option value="monthly" selected>Last 30 Days</option>
            <option value="quarterly">Last 90 Days</option>
            <option value="annual">Last 365 Days</option>
          </select>
        </div>
      </div>
      
      <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
        <button onclick="downloadDriverEarnings('xlsx')" class="bg-koda-line hover:bg-koda-golddim text-koda-cream px-4 py-3 rounded-lg text-sm font-medium transition-all flex items-center justify-center gap-2">
          <i data-lucide="users" class="w-4 h-4 text-blue-400"></i>
          Driver Earnings Excel
        </button>
        <button onclick="downloadOrders('storage-orders', 'xlsx')" class="bg-koda-line hover:bg-koda-golddim text-koda-cream px-4 py-3 rounded-lg text-sm font-medium transition-all flex items-center justify-center gap-2">
          <i data-lucide="warehouse" class="w-4 h-4 text-amber-400"></i>
          Storage Orders Excel
        </button>
        <button onclick="downloadOrders('transport-orders', 'xlsx')" class="bg-koda-line hover:bg-koda-golddim text-koda-cream px-4 py-3 rounded-lg text-sm font-medium transition-all flex items-center justify-center gap-2">
          <i data-lucide="truck" class="w-4 h-4 text-amber-400"></i>
          Transport Orders Excel
        </button>
      </div>
    </div>

    <div id="drivers-grid" class="grid grid-cols-1 lg:grid-cols-2 gap-6">
      <div class="bg-koda-panel h-96 rounded animate-pulse"></div>
      <div class="bg-koda-panel h-96 rounded animate-pulse"></div>
    </div>
  </div>

  <script>
    // Role-based nav visibility
    async function initRole() {
      try {
        const res = await fetch('/api/me', { credentials: 'include' });
        if (!res.ok) {
          if (res.status === 401) window.location.href = '/login';
          return;
        }
        const { data } = await res.json();
        const role = data.role;
        if (role === 'transport') {
          document.getElementById('nav-storage')?.classList.add('hidden');
          document.getElementById('nav-drivers')?.classList.add('hidden');
        } else if (role === 'storage') {
          document.getElementById('nav-shipments')?.classList.add('hidden');
          document.getElementById('nav-drivers')?.classList.add('hidden');
        }
      } catch {
        // silently fail — auth middleware will redirect if needed
      }
    }
    initRole();

    lucide.createIcons();
    
    let allDrivers = [];
    let dynamicRevenue = 0;
    let autoRefreshEnabled = true;
    let autoRefreshInterval = null;
    let isRefreshing = false;
    let isInitialLoad = true;
    
    function toggleAutoRefresh() {
      autoRefreshEnabled = !autoRefreshEnabled;
      const btn = document.getElementById('btn-auto-refresh');
      const status = document.getElementById('auto-refresh-status');
      
      if (autoRefreshEnabled) {
        btn.className = 'flex items-center gap-2 bg-koda-gold text-koda-ink px-4 py-2 rounded text-sm hover:brightness-110';
        status.innerText = 'On';
        startAutoRefresh();
      } else {
        btn.className = 'flex items-center gap-2 bg-koda-line text-koda-cream px-4 py-2 rounded text-sm hover:bg-koda-golddim';
        status.innerText = 'Off';
        stopAutoRefresh();
      }
      
      lucide.createIcons();
    }
    
    function startAutoRefresh() {
      if (autoRefreshInterval) clearInterval(autoRefreshInterval);
      autoRefreshInterval = setInterval(() => {
        if (autoRefreshEnabled) {
          refreshData();
        }
      }, 30000);
    }
    
    function stopAutoRefresh() {
      if (autoRefreshInterval) {
        clearInterval(autoRefreshInterval);
        autoRefreshInterval = null;
      }
    }

    async function logout() {
      await fetch('/api/logout', { method: 'POST', credentials: 'include' });
      window.location.href = '/login';
    }

    async function refreshData() {
      if (isRefreshing) {
        console.log('Refresh already in progress, skipping...');
        return;
      }
      isRefreshing = true;
      try {
        await Promise.all([loadDriverStats(), loadDynamicRevenue()]);
        document.getElementById('last-updated').innerText = 'Last updated: ' + new Date().toLocaleTimeString();
      } catch (error) {
        console.error('Error:', error);
        showToast('Failed to load data', 'red');
      } finally {
        isRefreshing = false;
      }
    }

    function renderStatsCards() {
      const onlineCount = allDrivers.filter(d => d.is_online === true || d.is_online === 'true').length;
      const avgSuccessRate = allDrivers.length > 0 
        ? (allDrivers.reduce((sum, d) => sum + (parseFloat(d.success_rate) || 0), 0) / allDrivers.length).toFixed(1)
        : 0;
      
      const makeCard = (label, val, color) => {
        return `<div class="stat-card flex-none w-[150px] snap-start bg-koda-cream rounded-md p-4 pb-5 border border-koda-line shadow-[0_4px_14px_rgba(0,0,0,.5)] transition-all">
                <div class="flex items-center gap-1.5 mb-1">
                <span class="inline-block w-2.5 h-2.5 rounded-sm bg-${color}-500 flex-shrink-0"></span>
                <span class="text-[#6b6152] text-[10px] font-bold uppercase tracking-[0.15em]">${label}</span>
                </div>
                <div class="stat-num text-2xl font-bold text-koda-ink">${val}</div>
                </div>`;
      };
      
      document.getElementById('driver-stats-grid').innerHTML = 
        makeCard('Total Drivers', allDrivers.length, 'blue') +
        makeCard('Online Now', onlineCount, 'green') +
        makeCard('Total Revenue', '$' + dynamicRevenue.toFixed(2), 'amber') +
        makeCard('Avg Success', avgSuccessRate + '%', 'cyan');
    }
    
    async function loadDynamicRevenue() {
      try {
        const res = await fetch('/api/drivers/revenue', {
          headers: { 'Accept': 'application/json' },
          credentials: 'include'
        });
        if (res.ok) {
          const result = await res.json();
          dynamicRevenue = result.data?.total_revenue || 0;
        }
      } catch (e) {
        console.error('Failed to load dynamic revenue:', e);
      }
    }

    async function loadDriverStats() {
      try {
        // Use the cached driver_stats table (maintained by main app via triggers)
        const res = await fetch('/api/drivers/stats', {
          headers: { 'Accept': 'application/json' },
          credentials: 'include'
        });
        
        if (!res.ok) {
          if (res.status === 401) {
            window.location.href = '/login';
            return;
          }
          throw new Error('HTTP error ' + res.status);
        }
        
        const result = await res.json();
        allDrivers = result.data || [];
        
        // Calculate online count from driver_profiles data
        const onlineCount = allDrivers.filter(d => d.is_online === true || d.is_online === 'true').length;
        
        document.getElementById('status-indicator').className = "w-2 h-2 rounded-full bg-emerald-500";
        document.getElementById('status-text').innerText = onlineCount + ' of ' + allDrivers.length + ' drivers online';
        
        renderStatsCards();
        applySortAndFilter();
        
      } catch (e) { 
        console.error("Error:", e);
        document.getElementById('status-indicator').className = "w-2 h-2 rounded-full bg-rose-500";
        document.getElementById('status-text').innerText = "Error";
        showToast("Failed to load driver data", "red");
      }
    }
    
    function applySortAndFilter() {
      let filtered = [...allDrivers];
      const searchQuery = document.getElementById('searchInput').value.toLowerCase().trim();
      const filterValue = document.getElementById('filter-select').value;
      
      // Apply search filter
      if (searchQuery) {
        filtered = filtered.filter(d => {
          const searchText = [
            d.first_name,
            d.last_name,
            d.email,
            d.phone
          ].filter(Boolean).join(' ').toLowerCase();
          return searchText.includes(searchQuery);
        });
      }
      
      // Apply dropdown filter
      if (filterValue === 'online') {
        filtered = filtered.filter(d => d.is_online);
      } else if (filterValue === 'offline') {
        filtered = filtered.filter(d => !d.is_online);
      } else if (filterValue === 'high-performers') {
        filtered = filtered.filter(d => {
          const successRate = parseFloat(d.success_rate);
          return !isNaN(successRate) && successRate >= 90;
        });
      } else if (filterValue === 'needs-attention') {
        filtered = filtered.filter(d => {
          const successRate = parseFloat(d.success_rate);
          const cancelRate = parseFloat(d.cancel_rate);
          return isNaN(successRate) || successRate < 70 || (!isNaN(cancelRate) && cancelRate > 20);
        });
      }
      
      // Calculate online count for header
      const onlineCount = allDrivers.filter(d => d.is_online === true || d.is_online === 'true').length;
      
      // Update status text with filtered count and online status
      if (searchQuery || filterValue !== 'all') {
        document.getElementById('status-text').innerText = filtered.length + ' of ' + allDrivers.length + ' drivers (' + onlineCount + ' online)';
      } else {
        document.getElementById('status-text').innerText = onlineCount + ' of ' + allDrivers.length + ' drivers online';
      }
      
      const sortValue = document.getElementById('sort-select').value;
      filtered.sort((a, b) => {
        switch(sortValue) {
          case 'deliveries-desc': return (b.total_completed || 0) - (a.total_completed || 0);
          case 'deliveries-asc': return (a.total_completed || 0) - (b.total_completed || 0);
          case 'revenue-desc': return (parseFloat(b.total_revenue) || 0) - (parseFloat(a.total_revenue) || 0);
          case 'revenue-asc': return (parseFloat(a.total_revenue) || 0) - (parseFloat(b.total_revenue) || 0);
          case 'success-desc': return (parseFloat(b.success_rate) || 0) - (parseFloat(a.success_rate) || 0);
          case 'success-asc': return (parseFloat(a.success_rate) || 0) - (parseFloat(b.success_rate) || 0);
          case 'cancel-desc': return (parseFloat(b.cancel_rate) || 0) - (parseFloat(a.cancel_rate) || 0);
          case 'cancel-asc': return (parseFloat(a.cancel_rate) || 0) - (parseFloat(b.cancel_rate) || 0);
          case 'active-recent': return new Date(b.last_active || 0) - new Date(a.last_active || 0);
          case 'active-oldest': return new Date(a.last_active || 0) - new Date(b.last_active || 0);
          default: return 0;
        }
      });
      
      renderDriverCards(filtered);
    }

    function renderDriverCards(drivers) {
      const grid = document.getElementById('drivers-grid');
      
      if (drivers.length === 0) {
        grid.innerHTML = '<div class="col-span-full text-center text-koda-mute py-12">No drivers found</div>';
        return;
      }
      
      grid.innerHTML = drivers.map(driver => {
        const name = (driver.first_name || '') + ' ' + (driver.last_name || '');
        const initials = name.trim().split(' ').map(n => n[0] || '').join('').toUpperCase().slice(0, 2) || '??';
        
        const successRate = driver.success_rate !== null ? parseFloat(driver.success_rate).toFixed(1) : null;
        const successRateDisplay = successRate !== null ? successRate + '%' : 'N/A';
        const successRateColor = successRate !== null 
                                  ? (successRate >= 90 ? 'green' : successRate >= 70 ? 'yellow' : 'red')
                                  : 'slate';
        
        const cancelRate = driver.cancel_rate !== null ? parseFloat(driver.cancel_rate).toFixed(1) + '%' : 'N/A';
        const cancelRateColor = driver.cancel_rate !== null && parseFloat(driver.cancel_rate) > 10 ? 'red' : 'slate';
        
        const totalRevenue = (parseFloat(driver.total_revenue) || 0).toFixed(2);
        const monthRevenue = (parseFloat(driver.month_revenue) || 0).toFixed(2);
        const weekRevenue = (parseFloat(driver.week_revenue) || 0).toFixed(2);
        
        // Calculate rating based on success rate (+weight) and cancel rate (-weight)
        const successRateVal = parseFloat(driver.success_rate) || 0;
        const cancelRateVal = parseFloat(driver.cancel_rate) || 0;
        // Formula: 1 + success_rate/25 - cancel_rate/23
        // Cancel rate hurts more than success rate helps
        let calcRating = 1.0 + (successRateVal / 25) - (cancelRateVal / 23);
        calcRating = Math.max(1.0, Math.min(5.0, calcRating));
        const displayRating = calcRating.toFixed(1);
        const ratingColor = calcRating >= 4.0 ? 'yellow' : calcRating >= 3.0 ? 'slate' : 'red';
        
        const lastActive = driver.last_active ? new Date(driver.last_active).toLocaleDateString() : 'N/A';
        const driverSince = driver.driver_joined ? new Date(driver.driver_joined).toLocaleDateString() : 'N/A';
        
        return '<div class="driver-card bg-koda-panel rounded-xl p-6 border-2 border-koda-line">' +
          '<div class="flex items-start gap-4 mb-4">' +
            '<div class="w-16 h-16 rounded-full bg-gradient-to-br from-emerald-500 to-blue-500 flex items-center justify-center text-white font-bold text-xl">' +
              initials +
            '</div>' +
            '<div class="flex-1">' +
              '<h3 class="text-lg font-bold">' + name + '</h3>' +
              '<p class="text-xs text-koda-mute">' + (driver.email || 'No email') + '</p>' +
              '<span class="text-xs text-' + (driver.is_online ? 'green' : 'slate') + '-400">' +
                (driver.is_online ? '● Online' : '● Offline') +
              '</span>' +
            '</div>' +
          '</div>' +
          
          '<div class="flex gap-2 mb-4 text-xs">' +
            '<span class="bg-blue-900/30 text-blue-400 px-2 py-1 rounded">Assigned: ' + (driver.assigned_count || 0) + '</span>' +
            '<span class="bg-amber-900/30 text-amber-400 px-2 py-1 rounded">In Transit: ' + (driver.in_transit_count || 0) + '</span>' +
            '<span class="bg-koda-line text-koda-cream px-2 py-1 rounded">Pending: ' + (driver.pending_count || 0) + '</span>' +
          '</div>' +
          
          '<div class="grid grid-cols-2 gap-3 mb-3">' +
            '<div class="bg-koda-base/50 rounded-lg p-3">' +
              '<div class="text-xs text-koda-mute">Total Assigned</div>' +
              '<div class="text-xl font-bold">' + (driver.total_assigned || 0) + '</div>' +
            '</div>' +
            '<div class="bg-koda-base/50 rounded-lg p-3">' +
              '<div class="text-xs text-koda-mute">Total Completed</div>' +
              '<div class="text-xl font-bold">' + (driver.total_completed || 0) + '</div>' +
            '</div>' +
          '</div>' +
          
          '<div class="grid grid-cols-3 gap-2 mb-3">' +
            '<div class="bg-koda-base/50 rounded-lg p-2">' +
              '<div class="text-xs text-koda-mute">Monthly Completed</div>' +
              '<div class="text-lg font-bold">' + (driver.month_completed || 0) + '</div>' +
            '</div>' +
            '<div class="bg-koda-base/50 rounded-lg p-2">' +
              '<div class="text-xs text-koda-mute">Cancelled Count</div>' +
              '<div class="text-lg font-bold text-rose-400">' + (driver.cancelled_count || 0) + '</div>' +
            '</div>' +
            '<div class="bg-koda-base/50 rounded-lg p-2">' +
              '<div class="text-xs text-koda-mute">Rating</div>' +
              '<div class="text-lg font-bold text-' + ratingColor + '-400">' + displayRating + ' ★</div>' +
            '</div>' +
          '</div>' +
          
          '<div class="grid grid-cols-2 gap-3 mb-3">' +
            '<div class="bg-koda-base/50 rounded-lg p-3 border border-' + successRateColor + '-500/30">' +
              '<div class="text-xs text-koda-mute">Success Rate</div>' +
              '<div class="text-xl font-bold text-' + successRateColor + '-400">' + successRateDisplay + '</div>' +
            '</div>' +
            '<div class="bg-koda-base/50 rounded-lg p-3 border border-' + cancelRateColor + '-500/30">' +
              '<div class="text-xs text-koda-mute">Cancel Rate</div>' +
              '<div class="text-xl font-bold text-' + cancelRateColor + '-400">' + cancelRate + '</div>' +
            '</div>' +
          '</div>' +
          
          '<div class="grid grid-cols-3 gap-2 mb-3">' +
            '<div class="bg-koda-base/50 rounded-lg p-2">' +
              '<div class="text-xs text-koda-mute">Total Revenue</div>' +
              '<div class="text-lg font-bold text-koda-gold">$' + totalRevenue + '</div>' +

    // Pick the right style index for a cell given its header name, row parity, and sheet type
    function pickStyle(headerName, isEven, isTotalRow, cellValue) {
        if (isTotalRow) {
            if (['Transport Revenue','Storage Revenue','Total Revenue','Week Revenue','Month Revenue','Total Revenue'].includes(headerName)) return SX.TOTAL_CURRENCY;
            if (['Total Assigned','Total Completed','Week Completed','Month Completed','Transport Orders','Storage Orders','Total Orders'].includes(headerName)) return SX.TOTAL_INTEGER;
            return SX.TOTAL;
        }
        if (['Transport Revenue','Storage Revenue','Total Revenue','Week Revenue','Month Revenue'].includes(headerName)) {
            if (headerName === 'Transport Revenue') return isEven ? SX.CURRENCY_BLUE_STRIPE   : SX.CURRENCY_BLUE;
            if (headerName === 'Storage Revenue')   return isEven ? SX.CURRENCY_PURPLE_STRIPE : SX.CURRENCY_PURPLE;
            return isEven ? SX.CURRENCY_GREEN_STRIPE : SX.CURRENCY_GREEN;
        }
        if (['Total Assigned','Total Completed','Week Completed','Month Completed','Transport Orders','Storage Orders','Total Orders'].includes(headerName)) {
            return isEven ? SX.INTEGER_STRIPE : SX.INTEGER;
        }
        if (['Success Rate','Cancel Rate'].includes(headerName)) return isEven ? SX.PERCENT_STRIPE : SX.PERCENT;
        if (headerName === 'Status') return cellValue === 'Online' ? SX.STATUS_ONLINE : SX.STATUS_OFFLINE;
        if (['Period','Email','Customer Email','Driver Name'].includes(headerName)) return isEven ? SX.LEFT_STRIPE : SX.LEFT;
        return isEven ? SX.STRIPE : SX.DEFAULT;
    }

    // Patch @s attributes on every <c> element in a sheet XML string
    function applyStylesToSheetXml(sheetXml, ws) {
        if (!ws['!ref']) return sheetXml;
        const range = XLSX.utils.decode_range(ws['!ref']);
        // Build header map: col index → header name
        const headers = {};
        for (let c = range.s.c; c <= range.e.c; c++) {
            const ref = XLSX.utils.encode_cell({ r: range.s.r, c });
            headers[c] = ws[ref]?.v || '';
        }
        const totalRows = range.e.r;

        // Replace each <c r="XN" ...> tag, injecting or replacing s="N"
        return sheetXml.replace(/<c r="([A-Z]+)(\d+)"([^>]*?)(\/>|>)/g, (match, col, rowStr, attrs, close) => {
            const row = parseInt(rowStr) - 1; // 0-based
            const colIdx = XLSX.utils.decode_col(col);
            let sx;
            if (row === range.s.r) {
                sx = SX.HEADER;
            } else {
                const isEven = row % 2 === 0;
                const isTotalRow = row === totalRows;
                const headerName = headers[colIdx] || '';
                // Get cell value for Status detection
                const cellRef = XLSX.utils.encode_cell({ r: row, c: colIdx });
                const cellVal = ws[cellRef]?.v ?? '';
                sx = pickStyle(headerName, isEven, isTotalRow, cellVal);
            }
            // Remove existing s="..." and inject new one
            const cleanAttrs = attrs.replace(/\s*s="\d+"/, '');
            return `<c r="${col}${rowStr}" s="${sx}"${cleanAttrs}${close}`;
        });
    }

    // Compute auto column widths from cell values
    function computeColWidths(ws) {
        if (!ws['!ref']) return [];
        const range = XLSX.utils.decode_range(ws['!ref']);
        const widths = [];
        for (let c = range.s.c; c <= range.e.c; c++) {
            let max = 8;
            for (let r = range.s.r; r <= range.e.r; r++) {
                const ref = XLSX.utils.encode_cell({ r, c });
                const len = String(ws[ref]?.v ?? '').length;
                if (len > max) max = len;
            }
            widths.push(Math.min(max + 2, 50));
        }
        return widths;
    }

    // Inject col widths into sheet XML — replaces existing <cols> block if present
    function applyColWidths(sheetXml, widths) {
        const colsXml = '<cols>' + widths.map((w, i) =>
            `<col min="${i+1}" max="${i+1}" width="${w}" customWidth="1"/>`
        ).join('') + '</cols>';
        // Replace existing <cols>...</cols> if SheetJS already wrote one
        if (sheetXml.includes('<cols>')) {
            return sheetXml.replace(/<cols>[\s\S]*?<\/cols>/, colsXml);
        }
        // Otherwise insert before <sheetData>
        return sheetXml.replace('<sheetData>', colsXml + '<sheetData>');
    }

    async function writeThemedXLSX(wb, filename) {
        try {
            // Write plain data (no styles) — SheetJS free can't write styles anyway
            const xlsxData = XLSX.write(wb, { type: 'array', bookType: 'xlsx' });
            const zip = await JSZip.loadAsync(xlsxData);

            // Inject custom theme
            zip.file('xl/theme/theme1.xml', LL_THEME_XML);

            // Inject our full styles.xml
            zip.file('xl/styles.xml', STYLES_XML);

            // Patch each sheet's XML with style indices + col widths
            for (const sheetName of wb.SheetNames) {
                const ws = wb.Sheets[sheetName];
                const sheetIndex = wb.SheetNames.indexOf(sheetName) + 1;
                const sheetPath = `xl/worksheets/sheet${sheetIndex}.xml`;
                let sheetXml = await zip.file(sheetPath).async('string');
                sheetXml = applyStylesToSheetXml(sheetXml, ws);
                const widths = computeColWidths(ws);
                if (widths.length) sheetXml = applyColWidths(sheetXml, widths);
                zip.file(sheetPath, sheetXml);
            }

            const blob = await zip.generateAsync({
                type: 'blob',
                mimeType: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'
            });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        } catch (e) {
            console.error('writeThemedXLSX failed:', e);
            XLSX.writeFile(wb, filename);
        }
    }

                'Week Completed': d.week_completed || 0,

    // Status color mapping for Excel cells (ARGB 8-digit format required by SheetJS)
    function getStatusStyle(status) {
        const map = {
            'PENDING':    { fill: { fgColor: { rgb: 'FFFEF3C7' }, patternType: 'solid' }, font: { color: { rgb: 'FF92400E' }, bold: true, sz: 10 } },
            'ASSIGNED':   { fill: { fgColor: { rgb: 'FFDBEAFE' }, patternType: 'solid' }, font: { color: { rgb: 'FF1E40AF' }, bold: true, sz: 10 } },
            'IN_TRANSIT': { fill: { fgColor: { rgb: 'FFEDE9FE' }, patternType: 'solid' }, font: { color: { rgb: 'FF5B21B6' }, bold: true, sz: 10 } },
            'DELIVERED':  { fill: { fgColor: { rgb: 'FFDCFCE7' }, patternType: 'solid' }, font: { color: { rgb: 'FF166534' }, bold: true, sz: 10 } },
            'CANCELLED':  { fill: { fgColor: { rgb: 'FFFEE2E2' }, patternType: 'solid' }, font: { color: { rgb: 'FF991B1B' }, bold: true, sz: 10 } },
        };
        return map[status] || { font: { sz: 10 } };
    }

    async function downloadOrders(type, format = 'csv') {
        const period = document.getElementById('export-period').value;
        const days = period === 'weekly' ? 7 : period === 'monthly' ? 30 : period === 'quarterly' ? 90 : 365;
        
        try {
            showToast(`Downloading ${format.toUpperCase()}...`, 'green');
            const res = await fetch(`/api/export/${type}.json?days=${days}`, {
                credentials: 'include'
            });
            
            if (!res.ok) throw new Error('Failed to download data');
            
            const result = await res.json();
            const orders = result.data || [];
            
            if (orders.length === 0) {
                showToast('No data to export', 'red');
                return;
            }
            
            if (format === 'xlsx') {
                const ws = XLSX.utils.json_to_sheet(orders);
                const wb = XLSX.utils.book_new();
                const sheetName = type === 'storage-orders' ? 'Storage Orders' : 'Transport Orders';
                XLSX.utils.book_append_sheet(wb, ws, sheetName);
                
                const range = XLSX.utils.decode_range(ws['!ref'] || 'A1');
                const isStorage = type === 'storage-orders';
                
                
                writeThemedXLSX(wb, `${type}-${new Date().toISOString().split('T')[0]}.xlsx`);
            } else {
                // CSV format - convert JSON to CSV
                const headers = Object.keys(orders[0]);
                const csvRows = [headers.join(',')];
                
                orders.forEach(row => {
                    const values = headers.map(h => {
                        const val = row[h] ?? '';
                        return `"${String(val).replace(/"/g, '""')}"`;
                    });
                    csvRows.push(values.join(','));
                });
                
                const csv = csvRows.join('\n');
                const blob = new Blob([csv], { type: 'text/csv' });
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `${type}-${new Date().toISOString().split('T')[0]}.csv`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                window.URL.revokeObjectURL(url);
            }
            
            showToast(`${format.toUpperCase()} downloaded!`, 'green');
        } catch (e) {
            console.error(e);
            showToast(`Failed to download ${format.toUpperCase()}`, 'red');
        }
    }
    
    // Legacy function for backward compatibility
    async function downloadCSV(type) {
        await downloadOrders(type, 'csv');
    }

    // Earnings Report Functions
    let currentEarningsData = [];
    let currentEarningsTotals = null;

    async function loadEarningsReport() {
        const type = document.getElementById('earnings-report-type').value;
        
        try {
            showToast('Loading earnings report...', 'green');
            const res = await fetch(`/api/reports/earnings-breakdown?type=${type}`, {
                credentials: 'include'
            });
            
            if (!res.ok) throw new Error('Failed to load earnings report');
            
            const result = await res.json();
            currentEarningsData = result.data || [];
            currentEarningsTotals = result.totals || null;
            
            // Update summary cards
            if (currentEarningsTotals) {
                document.getElementById('total-revenue').innerText = '$' + currentEarningsTotals.totalRevenue.toFixed(2);
                document.getElementById('transport-revenue').innerText = '$' + currentEarningsTotals.totalTransportRevenue.toFixed(2);
                document.getElementById('storage-revenue').innerText = '$' + currentEarningsTotals.totalStorageRevenue.toFixed(2);
                document.getElementById('total-orders').innerText = currentEarningsTotals.totalOrders.toLocaleString();
            }
            
            // Update table
            const tbody = document.getElementById('earnings-table-body');
            if (currentEarningsData.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5" class="text-center py-4 text-koda-mute">No earnings data found</td></tr>';
            } else {
                tbody.innerHTML = currentEarningsData.map(row => `
                    <tr class="border-b border-koda-line hover:bg-koda-panel/50">
                        <td class="py-2 px-3 font-medium">${row.period}</td>
                        <td class="py-2 px-3 text-right text-blue-400">$${row.transportRevenue.toFixed(2)}</td>
                        <td class="py-2 px-3 text-right text-amber-400">$${row.storageRevenue.toFixed(2)}</td>
                        <td class="py-2 px-3 text-right font-bold text-koda-gold">$${row.totalRevenue.toFixed(2)}</td>
                        <td class="py-2 px-3 text-right">${row.totalOrders.toLocaleString()}</td>
                    </tr>
                `).join('');
            }
            
            showToast('Earnings report loaded!', 'green');
        } catch (e) {
            console.error(e);
            showToast('Failed to load earnings report', 'red');
        }
    }

    async function downloadEarningsReport(format = 'csv') {
        if (currentEarningsData.length === 0) {
            showToast('Please load the report first', 'red');
            return;
        }
        
        try {
            showToast(`Downloading ${format.toUpperCase()}...`, 'green');
            
            if (format === 'xlsx') {
                // Create XLSX
                const data = currentEarningsData.map(row => ({
                    'Period': row.period,
                    'Transport Revenue': row.transportRevenue,
                    'Storage Revenue': row.storageRevenue,
                    'Total Revenue': row.totalRevenue,
                    'Transport Orders': row.transportOrders,
                    'Storage Orders': row.storageOrders,
                    'Total Orders': row.totalOrders
                }));
                
                // Add totals row
                if (currentEarningsTotals) {
                    data.push({
                        'Period': 'TOTAL',
                        'Transport Revenue': currentEarningsTotals.totalTransportRevenue,
                        'Storage Revenue': currentEarningsTotals.totalStorageRevenue,
                        'Total Revenue': currentEarningsTotals.totalRevenue,
                        'Transport Orders': currentEarningsTotals.totalTransportOrders,
                        'Storage Orders': currentEarningsTotals.totalStorageOrders,
                        'Total Orders': currentEarningsTotals.totalOrders
                    });
                }
                
                const ws = XLSX.utils.json_to_sheet(data);
                const wb = XLSX.utils.book_new();
                XLSX.utils.book_append_sheet(wb, ws, 'Earnings Report');
                
                
                const type = document.getElementById('earnings-report-type').value;
                writeThemedXLSX(wb, `earnings-report-${type}-${new Date().toISOString().split('T')[0]}.xlsx`);
            } else {
                // CSV format

                currentEarningsData.forEach(row => {
                    csv += `"${row.period}","$${row.transportRevenue.toFixed(2)}","$${row.storageRevenue.toFixed(2)}","$${row.totalRevenue.toFixed(2)}",${row.transportOrders},${row.storageOrders},${row.totalOrders}\n`;

                }
                
                const blob = new Blob([csv], { type: 'text/csv' });
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                const type = document.getElementById('earnings-report-type').value;
                a.href = url;
                a.download = `earnings-report-${type}-${new Date().toISOString().split('T')[0]}.csv`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                window.URL.revokeObjectURL(url);
            }
            
            showToast(`${format.toUpperCase()} downloaded!`, 'green');
        } catch (e) {
            console.error(e);
            showToast(`Failed to download ${format.toUpperCase()}`, 'red');
        }
    }
