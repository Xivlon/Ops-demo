<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Driver Performance - LuggageLink Ops</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            slate: {
              50: '#f8fafc', 100: '#f1f5f9', 200: '#e2e8f0', 300: '#cbd5e1',
              400: '#94a3b8', 500: '#64748b', 600: '#475569', 700: '#334155',
              800: '#1e293b', 900: '#0f172a', 950: '#020617',
            }
          }
        }
      }
    }
  </script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    body { font-family: sans-serif; }
    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: #0f172a; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #475569; }
    .driver-card { transition: all 0.3s ease; }
    .driver-card:hover { transform: translateY(-2px); }
    
    /* Loading Overlay */
    #loading-overlay {
      position: fixed;
      inset: 0;
      background: #0f172a;
      z-index: 9999;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: opacity 0.4s ease, visibility 0.4s ease;
    }
    #loading-overlay.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }
    .loading-spinner {
      width: 48px;
      height: 48px;
      border: 3px solid #334155;
      border-top-color: #8b5cf6;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .loading-text {
      margin-top: 16px;
      color: #94a3b8;
      font-size: 14px;
      text-align: center;
    }
    /* Navigation active state */
    .nav-link.active {
      background: #334155;
      color: #4ade80;
    }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen">
  
  <!-- Loading Overlay -->
  <div id="loading-overlay">
    <div class="flex flex-col items-center">
      <div class="loading-spinner"></div>
      <div class="loading-text">Loading Driver Performance...</div>
    </div>
  </div>
  
  <nav class="bg-slate-800 border-b border-slate-700 px-6 py-4 sticky top-0 z-50 shadow-md">
    <div class="max-w-7xl mx-auto flex justify-between items-center">
      <div class="flex items-center gap-3">
        <div class="bg-emerald-600 p-2.5 rounded-lg shadow-inner shadow-emerald-400/20">
          <i data-lucide="users" class="w-7 h-7"></i>
        </div>
        <div>
          <h1 class="text-xl font-bold tracking-tight">Driver Performance</h1>
          <div class="flex items-center gap-2">
            <span id="status-indicator" class="w-2 h-2 rounded-full bg-yellow-500 animate-pulse"></span>
            <p id="status-text" class="text-xs text-slate-400 font-medium">Loading...</p>
          </div>
        </div>
      </div>
      <div class="flex items-center gap-2">
        <!-- Navigation Links -->
        <a href="/" class="nav-link px-4 py-2 rounded-lg text-slate-400 hover:text-green-400 hover:bg-slate-700 transition-all flex items-center gap-2">
          <i data-lucide="package" class="w-4 h-4"></i>
          <span class="hidden sm:inline text-sm font-medium">Shipments</span>
        </a>
        <a href="/storage" class="nav-link px-4 py-2 rounded-lg text-slate-400 hover:text-green-400 hover:bg-slate-700 transition-all flex items-center gap-2">
          <i data-lucide="warehouse" class="w-4 h-4"></i>
          <span class="hidden sm:inline text-sm font-medium">Storage</span>
        </a>
        <a href="/drivers" class="nav-link active px-4 py-2 rounded-lg text-green-400 bg-slate-700 transition-all flex items-center gap-2">
          <i data-lucide="users" class="w-4 h-4"></i>
          <span class="hidden sm:inline text-sm font-medium">Drivers</span>
        </a>
        <div class="w-px h-6 bg-slate-700 mx-1"></div>
        <button onclick="refreshData()" class="p-2.5 rounded-lg text-slate-400 hover:text-emerald-400 hover:bg-slate-800 transition-all" title="Refresh">
          <i data-lucide="refresh-cw" class="w-5 h-5"></i>
        </button>
        <button onclick="logout()" class="p-2.5 rounded-lg text-slate-400 hover:text-red-400 hover:bg-slate-800 transition-all" title="Logout">
          <i data-lucide="log-out" class="w-5 h-5"></i>
        </button>
      </div>
    </div>
  </nav>

  <div class="max-w-7xl mx-auto p-6 space-y-6">
    <div id="toast-container" class="fixed top-24 right-6 z-50"></div>
    
    <!-- Stats Cards -->
    <div class="grid grid-cols-2 md:grid-cols-4 gap-4" id="driver-stats-grid">
      <div class="bg-slate-800 h-24 rounded-xl animate-pulse"></div>
      <div class="bg-slate-800 h-24 rounded-xl animate-pulse"></div>
      <div class="bg-slate-800 h-24 rounded-xl animate-pulse"></div>
      <div class="bg-slate-800 h-24 rounded-xl animate-pulse"></div>
    </div>
    
    <!-- Controls Bar -->
    <div class="bg-slate-800 rounded-xl p-4 border border-slate-700 flex flex-wrap gap-4 items-center justify-between">
      <div class="flex items-center gap-4">
        <!-- Search -->
        <div class="relative">
          <i data-lucide="search" class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-500"></i>
          <input 
            type="text" 
            id="searchInput" 
            placeholder="Search drivers..." 
            oninput="applySortAndFilter()"
            class="bg-slate-900 border border-slate-600 text-slate-300 text-sm rounded-lg pl-9 pr-3 py-2 w-56 focus:border-emerald-500 outline-none placeholder:text-slate-600"
          >
        </div>
        
        <!-- Sort -->
        <div class="flex items-center gap-2">
          <i data-lucide="arrow-up-down" class="w-4 h-4 text-slate-500"></i>
          <select id="sort-select" onchange="applySortAndFilter()" class="bg-slate-900 text-slate-300 text-sm rounded-lg px-3 py-2 border border-slate-600 focus:border-emerald-500 outline-none cursor-pointer">
            <option value="deliveries-desc">Most Deliveries</option>
            <option value="deliveries-asc">Least Deliveries</option>
            <option value="revenue-desc">Highest Revenue</option>
            <option value="revenue-asc">Lowest Revenue</option>
            <option value="success-desc">Best Success Rate</option>
            <option value="success-asc">Worst Success Rate</option>
            <option value="cancel-desc">Highest Cancel Rate</option>
            <option value="cancel-asc">Lowest Cancel Rate</option>
            <option value="active-recent">Recently Active</option>
            <option value="active-oldest">Inactive Longest</option>
          </select>
        </div>
        
        <!-- Filter -->
        <div class="flex items-center gap-2">
          <i data-lucide="filter" class="w-4 h-4 text-slate-500"></i>
          <select id="filter-select" onchange="applySortAndFilter()" class="bg-slate-900 text-slate-300 text-sm rounded-lg px-3 py-2 border border-slate-600 focus:border-emerald-500 outline-none cursor-pointer">
            <option value="all">All Drivers</option>
            <option value="online">Online Only</option>
            <option value="offline">Offline Only</option>
            <option value="high-performers">High Performers</option>
            <option value="needs-attention">Needs Attention</option>
          </select>
        </div>
      </div>
      
      <div class="flex items-center gap-3">
        <!-- Auto-refresh Toggle -->
        <button onclick="toggleAutoRefresh()" id="btn-auto-refresh" class="flex items-center gap-2 bg-emerald-700 hover:bg-emerald-600 px-3 py-2 rounded-lg text-sm font-medium transition-colors" title="Automatically refresh data every 30 seconds">
          <i data-lucide="zap" class="w-4 h-4"></i>
          <span>Live:</span>
          <span id="auto-refresh-status">On</span>
        </button>
        
        <!-- Last Updated -->
        <div class="flex items-center gap-2 text-xs text-slate-400">
          <i data-lucide="clock" class="w-3 h-3"></i>
          <span id="last-updated">Loading...</span>
        </div>
      </div>
    </div>

    <div id="drivers-grid" class="grid grid-cols-1 lg:grid-cols-2 gap-6">
      <div class="bg-slate-800 h-96 rounded animate-pulse"></div>
      <div class="bg-slate-800 h-96 rounded animate-pulse"></div>
    </div>
  </div>

  <script>
    lucide.createIcons();
    
    let allDrivers = [];
    let dynamicRevenue = 0;
    let autoRefreshEnabled = true;
    let autoRefreshInterval = null;
    let isRefreshing = false;
    let isInitialLoad = true;
    
    function toggleAutoRefresh() {
      autoRefreshEnabled = !autoRefreshEnabled;
      const btn = document.getElementById('btn-auto-refresh');
      const status = document.getElementById('auto-refresh-status');
      
      if (autoRefreshEnabled) {
        btn.className = 'flex items-center gap-2 bg-emerald-700 px-4 py-2 rounded text-sm hover:bg-emerald-600';
        status.innerText = 'On';
        startAutoRefresh();
      } else {
        btn.className = 'flex items-center gap-2 bg-slate-700 px-4 py-2 rounded text-sm hover:bg-slate-600';
        status.innerText = 'Off';
        stopAutoRefresh();
      }
      
      lucide.createIcons();
    }
    
    function startAutoRefresh() {
      if (autoRefreshInterval) clearInterval(autoRefreshInterval);
      autoRefreshInterval = setInterval(() => {
        if (autoRefreshEnabled) {
          refreshData();
        }
      }, 30000);
    }
    
    function stopAutoRefresh() {
      if (autoRefreshInterval) {
        clearInterval(autoRefreshInterval);
        autoRefreshInterval = null;
      }
    }

    async function logout() {
      await fetch('/api/logout', { method: 'POST', credentials: 'include' });
      window.location.href = '/login';
    }

    async function refreshData() {
      if (isRefreshing) {
        console.log('Refresh already in progress, skipping...');
        return;
      }
      isRefreshing = true;
      try {
        await Promise.all([loadDriverStats(), loadDynamicRevenue()]);
        document.getElementById('last-updated').innerText = 'Last updated: ' + new Date().toLocaleTimeString();
      } catch (error) {
        console.error('Error:', error);
        showToast('Failed to load data', 'red');
      } finally {
        isRefreshing = false;
        // Hide loading overlay after initial load completes
        if (isInitialLoad) {
          isInitialLoad = false;
          document.getElementById('loading-overlay').classList.add('hidden');
        }
      }
    }

    function renderStatsCards() {
      const onlineCount = allDrivers.filter(d => d.is_online === true || d.is_online === 'true').length;
      const avgSuccessRate = allDrivers.length > 0 
        ? (allDrivers.reduce((sum, d) => sum + (parseFloat(d.success_rate) || 0), 0) / allDrivers.length).toFixed(1)
        : 0;
      
      const makeCard = (label, val, color) => {
        return `<div class="bg-slate-800 rounded-xl p-4 border border-slate-700 relative overflow-hidden group">
                <div class="absolute top-0 right-0 w-16 h-16 bg-${color}-500/10 rounded-bl-full -mr-2 -mt-2"></div>
                <div class="text-slate-400 text-[10px] font-bold uppercase tracking-wider mb-1">${label}</div>
                <div class="text-2xl font-black text-${color}-400 relative z-10">${val}</div>
                </div>`;
      };
      
      document.getElementById('driver-stats-grid').innerHTML = 
        makeCard('Total Drivers', allDrivers.length, 'blue') +
        makeCard('Online Now', onlineCount, 'green') +
        makeCard('Total Revenue', '$' + dynamicRevenue.toFixed(2), 'emerald') +
        makeCard('Avg Success', avgSuccessRate + '%', 'cyan');
    }
    
    async function loadDynamicRevenue() {
      try {
        const res = await fetch('/api/drivers/revenue', {
          headers: { 'Accept': 'application/json' },
          credentials: 'include'
        });
        if (res.ok) {
          const result = await res.json();
          dynamicRevenue = result.data?.total_revenue || 0;
        }
      } catch (e) {
        console.error('Failed to load dynamic revenue:', e);
      }
    }

    async function loadDriverStats() {
      try {
        // Use the cached driver_stats table (maintained by main app via triggers)
        const res = await fetch('/api/drivers/stats', {
          headers: { 'Accept': 'application/json' },
          credentials: 'include'
        });
        
        if (!res.ok) {
          if (res.status === 401) {
            window.location.href = '/login';
            return;
          }
          throw new Error('HTTP error ' + res.status);
        }
        
        const result = await res.json();
        allDrivers = result.data || [];
        
        // Calculate online count from driver_profiles data
        const onlineCount = allDrivers.filter(d => d.is_online === true || d.is_online === 'true').length;
        
        document.getElementById('status-indicator').className = "w-2 h-2 rounded-full bg-green-500";
        document.getElementById('status-text').innerText = onlineCount + ' of ' + allDrivers.length + ' drivers online';
        
        renderStatsCards();
        applySortAndFilter();
        
      } catch (e) { 
        console.error("Error:", e);
        document.getElementById('status-indicator').className = "w-2 h-2 rounded-full bg-red-500";
        document.getElementById('status-text').innerText = "Error";
        showToast("Failed to load driver data", "red");
      }
    }
    
    function applySortAndFilter() {
      let filtered = [...allDrivers];
      const searchQuery = document.getElementById('searchInput').value.toLowerCase().trim();
      const filterValue = document.getElementById('filter-select').value;
      
      // Apply search filter
      if (searchQuery) {
        filtered = filtered.filter(d => {
          const searchText = [
            d.first_name,
            d.last_name,
            d.email,
            d.phone
          ].filter(Boolean).join(' ').toLowerCase();
          return searchText.includes(searchQuery);
        });
      }
      
      // Apply dropdown filter
      if (filterValue === 'online') {
        filtered = filtered.filter(d => d.is_online);
      } else if (filterValue === 'offline') {
        filtered = filtered.filter(d => !d.is_online);
      } else if (filterValue === 'high-performers') {
        filtered = filtered.filter(d => {
          const successRate = parseFloat(d.success_rate);
          return !isNaN(successRate) && successRate >= 90;
        });
      } else if (filterValue === 'needs-attention') {
        filtered = filtered.filter(d => {
          const successRate = parseFloat(d.success_rate);
          const cancelRate = parseFloat(d.cancel_rate);
          return isNaN(successRate) || successRate < 70 || (!isNaN(cancelRate) && cancelRate > 20);
        });
      }
      
      // Calculate online count for header
      const onlineCount = allDrivers.filter(d => d.is_online === true || d.is_online === 'true').length;
      
      // Update status text with filtered count and online status
      if (searchQuery || filterValue !== 'all') {
        document.getElementById('status-text').innerText = filtered.length + ' of ' + allDrivers.length + ' drivers (' + onlineCount + ' online)';
      } else {
        document.getElementById('status-text').innerText = onlineCount + ' of ' + allDrivers.length + ' drivers online';
      }
      
      const sortValue = document.getElementById('sort-select').value;
      filtered.sort((a, b) => {
        switch(sortValue) {
          case 'deliveries-desc': return (b.total_completed || 0) - (a.total_completed || 0);
          case 'deliveries-asc': return (a.total_completed || 0) - (b.total_completed || 0);
          case 'revenue-desc': return (parseFloat(b.total_revenue) || 0) - (parseFloat(a.total_revenue) || 0);
          case 'revenue-asc': return (parseFloat(a.total_revenue) || 0) - (parseFloat(b.total_revenue) || 0);
          case 'success-desc': return (parseFloat(b.success_rate) || 0) - (parseFloat(a.success_rate) || 0);
          case 'success-asc': return (parseFloat(a.success_rate) || 0) - (parseFloat(b.success_rate) || 0);
          case 'cancel-desc': return (parseFloat(b.cancel_rate) || 0) - (parseFloat(a.cancel_rate) || 0);
          case 'cancel-asc': return (parseFloat(a.cancel_rate) || 0) - (parseFloat(b.cancel_rate) || 0);
          case 'active-recent': return new Date(b.last_active || 0) - new Date(a.last_active || 0);
          case 'active-oldest': return new Date(a.last_active || 0) - new Date(b.last_active || 0);
          default: return 0;
        }
      });
      
      renderDriverCards(filtered);
    }

    function renderDriverCards(drivers) {
      const grid = document.getElementById('drivers-grid');
      
      if (drivers.length === 0) {
        grid.innerHTML = '<div class="col-span-full text-center text-slate-400 py-12">No drivers found</div>';
        return;
      }
      
      grid.innerHTML = drivers.map(driver => {
        const name = (driver.first_name || '') + ' ' + (driver.last_name || '');
        const initials = name.trim().split(' ').map(n => n[0] || '').join('').toUpperCase().slice(0, 2) || '??';
        
        const successRate = driver.success_rate !== null ? parseFloat(driver.success_rate).toFixed(1) : null;
        const successRateDisplay = successRate !== null ? successRate + '%' : 'N/A';
        const successRateColor = successRate !== null 
                                  ? (successRate >= 90 ? 'green' : successRate >= 70 ? 'yellow' : 'red')
                                  : 'slate';
        
        const cancelRate = driver.cancel_rate !== null ? parseFloat(driver.cancel_rate).toFixed(1) + '%' : 'N/A';
        const cancelRateColor = driver.cancel_rate !== null && parseFloat(driver.cancel_rate) > 10 ? 'red' : 'slate';
        
        const totalRevenue = (parseFloat(driver.total_revenue) || 0).toFixed(2);
        const monthRevenue = (parseFloat(driver.month_revenue) || 0).toFixed(2);
        const weekRevenue = (parseFloat(driver.week_revenue) || 0).toFixed(2);
        
        // Calculate rating based on success rate (+weight) and cancel rate (-weight)
        const successRateVal = parseFloat(driver.success_rate) || 0;
        const cancelRateVal = parseFloat(driver.cancel_rate) || 0;
        // Formula: 1 + success_rate/25 - cancel_rate/23
        // Cancel rate hurts more than success rate helps
        let calcRating = 1.0 + (successRateVal / 25) - (cancelRateVal / 23);
        calcRating = Math.max(1.0, Math.min(5.0, calcRating));
        const displayRating = calcRating.toFixed(1);
        const ratingColor = calcRating >= 4.0 ? 'yellow' : calcRating >= 3.0 ? 'slate' : 'red';
        
        const lastActive = driver.last_active ? new Date(driver.last_active).toLocaleDateString() : 'N/A';
        const driverSince = driver.driver_joined ? new Date(driver.driver_joined).toLocaleDateString() : 'N/A';
        
        return '<div class="driver-card bg-slate-800 rounded-xl p-6 border-2 border-slate-700">' +
          '<div class="flex items-start gap-4 mb-4">' +
            '<div class="w-16 h-16 rounded-full bg-gradient-to-br from-emerald-500 to-blue-500 flex items-center justify-center text-white font-bold text-xl">' +
              initials +
            '</div>' +
            '<div class="flex-1">' +
              '<h3 class="text-lg font-bold">' + name + '</h3>' +
              '<p class="text-xs text-slate-400">' + (driver.email || 'No email') + '</p>' +
              '<span class="text-xs text-' + (driver.is_online ? 'green' : 'slate') + '-400">' +
                (driver.is_online ? '● Online' : '● Offline') +
              '</span>' +
            '</div>' +
          '</div>' +
          
          '<div class="flex gap-2 mb-4 text-xs">' +
            '<span class="bg-blue-900/30 text-blue-400 px-2 py-1 rounded">Assigned: ' + (driver.assigned_count || 0) + '</span>' +
            '<span class="bg-purple-900/30 text-purple-400 px-2 py-1 rounded">In Transit: ' + (driver.in_transit_count || 0) + '</span>' +
            '<span class="bg-slate-700 text-slate-300 px-2 py-1 rounded">Pending: ' + (driver.pending_count || 0) + '</span>' +
          '</div>' +
          
          '<div class="grid grid-cols-2 gap-3 mb-3">' +
            '<div class="bg-slate-900/50 rounded-lg p-3">' +
              '<div class="text-xs text-slate-400">Total Assigned</div>' +
              '<div class="text-xl font-bold">' + (driver.total_assigned || 0) + '</div>' +
            '</div>' +
            '<div class="bg-slate-900/50 rounded-lg p-3">' +
              '<div class="text-xs text-slate-400">Total Completed</div>' +
              '<div class="text-xl font-bold">' + (driver.total_completed || 0) + '</div>' +
            '</div>' +
          '</div>' +
          
          '<div class="grid grid-cols-3 gap-2 mb-3">' +
            '<div class="bg-slate-900/50 rounded-lg p-2">' +
              '<div class="text-xs text-slate-400">Monthly Completed</div>' +
              '<div class="text-lg font-bold">' + (driver.month_completed || 0) + '</div>' +
            '</div>' +
            '<div class="bg-slate-900/50 rounded-lg p-2">' +
              '<div class="text-xs text-slate-400">Cancelled Count</div>' +
              '<div class="text-lg font-bold text-red-400">' + (driver.cancelled_count || 0) + '</div>' +
            '</div>' +
            '<div class="bg-slate-900/50 rounded-lg p-2">' +
              '<div class="text-xs text-slate-400">Rating</div>' +
              '<div class="text-lg font-bold text-' + ratingColor + '-400">' + displayRating + ' ★</div>' +
            '</div>' +
          '</div>' +
          
          '<div class="grid grid-cols-2 gap-3 mb-3">' +
            '<div class="bg-slate-900/50 rounded-lg p-3 border border-' + successRateColor + '-500/30">' +
              '<div class="text-xs text-slate-400">Success Rate</div>' +
              '<div class="text-xl font-bold text-' + successRateColor + '-400">' + successRateDisplay + '</div>' +
            '</div>' +
            '<div class="bg-slate-900/50 rounded-lg p-3 border border-' + cancelRateColor + '-500/30">' +
              '<div class="text-xs text-slate-400">Cancel Rate</div>' +
              '<div class="text-xl font-bold text-' + cancelRateColor + '-400">' + cancelRate + '</div>' +
            '</div>' +
          '</div>' +
          
          '<div class="grid grid-cols-3 gap-2 mb-3">' +
            '<div class="bg-slate-900/50 rounded-lg p-2">' +
              '<div class="text-xs text-slate-400">Total Revenue</div>' +
              '<div class="text-lg font-bold text-emerald-400">$' + totalRevenue + '</div>' +
            '</div>' +
            '<div class="bg-slate-900/50 rounded-lg p-2">' +
              '<div class="text-xs text-slate-400">30-Day Revenue</div>' +
              '<div class="text-lg font-bold text-emerald-400">$' + monthRevenue + '</div>' +
            '</div>' +
            '<div class="bg-slate-900/50 rounded-lg p-2">' +
              '<div class="text-xs text-slate-400">Weekly Revenue</div>' +
              '<div class="text-lg font-bold text-emerald-400">$' + weekRevenue + '</div>' +
            '</div>' +
          '</div>' +
          
          '<div class="flex justify-between text-xs text-slate-500 pt-3 border-t border-slate-700">' +
            '<span>Last Active: ' + lastActive + '</span>' +
            '<span>Driver Since: ' + driverSince + '</span>' +
          '</div>' +
        '</div>';
      }).join('');
      
      lucide.createIcons();
    }

    function showToast(msg, color) {
      const container = document.getElementById('toast-container');
      const div = document.createElement('div');
      const bg = color === 'green' ? 'bg-green-600' : color === 'blue' ? 'bg-blue-600' : 'bg-red-600';
      div.className = bg + " text-white px-4 py-2 rounded shadow-lg mb-2 text-sm font-bold";
      div.innerText = msg;
      container.appendChild(div);
      setTimeout(() => div.remove(), 3000);
    }

    refreshData();
    startAutoRefresh();
    
    // Pause refresh when tab is hidden, refresh when visible
    document.addEventListener('visibilitychange', () => {
      if (document.hidden) {
        stopAutoRefresh();
      } else {
        refreshData();
        startAutoRefresh();
      }
    });
  </script>
</body>
</html>
