<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Ops Demo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: { extend: { colors: {
        koda: { base:'#101318', panel:'#1B2129', card:'#1f2630', line:'#2a3140', gold:'#7FB4A8', golddim:'#3f5a54', red:'#e2472f', cream:'#E8DCC8', ink:'#101318', mute:'#7d8590' }
      }, fontFamily: {
        sans: ['"Space Grotesk"','sans-serif'], mono: ['"Space Mono"','monospace']
      } } }
    }
  </script>
  <style>
    body { font-family: 'Inter', sans-serif; background: #101318; }
    #pin-input { font-family: 'JetBrains Mono', monospace; font-variant-numeric: tabular-nums; }
    .micro-label { letter-spacing: .15em; text-transform: uppercase; }
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: #101318; }
    ::-webkit-scrollbar-thumb { background: #2a3140; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #3f5a54; }
    .brand-mark { text-shadow: 0 0 12px rgba(127,180,168,.35); }
    .polaroid-card { transition: transform .2s ease, box-shadow .2s ease; }
    .polaroid-card:hover { transform: translateY(-2px); box-shadow: 0 10px 34px rgba(0,0,0,.65); }
    .shake { animation: shake 0.5s cubic-bezier(.36,.07,.19,.97) both; }
    @keyframes shake {
      10%, 90% { transform: translate3d(-1px, 0, 0); }
      20%, 80% { transform: translate3d(2px, 0, 0); }
      30%, 50%, 70% { transform: translate3d(-4px, 0, 0); }
      40%, 60% { transform: translate3d(4px, 0, 0); }
    }
    /* ── decorative flourishes (purely ornamental) ── */
    /* blinking terminal cursor on the wordmark */
    h1::after { content:'▮'; margin-left:3px; font-size:.75em; color:#7FB4A8; animation:blink 1.2s steps(1) infinite; }
    @keyframes blink { 50% { opacity:0; } }
    /* underline sweep on nav links */
    .nav-link { position:relative; }
    .nav-link::after { content:''; position:absolute; left:12px; right:12px; bottom:5px; height:2px; background:#7FB4A8; opacity:.85; transform:scaleX(0); transform-origin:left; transition:transform .25s ease; }
    .nav-link:hover::after, .nav-link.active::after { transform:scaleX(1); }
  </style>
</head>
<body class="bg-koda-base text-koda-cream min-h-screen flex items-center justify-center">

  <div class="w-full max-w-md p-8">
    <div class="text-center mb-8">
      <div class="bg-koda-gold w-16 h-16 rounded-full flex items-center justify-center mx-auto mb-4 shadow-lg shadow-koda-gold/20">
      </div>
      <h1 class="text-2xl font-bold brand-mark">Ops Demo</h1>
      <p class="micro-label text-xs text-koda-mute mt-2">Operations Console</p>
    </div>

    <form id="login-form" class="polaroid-card bg-koda-card text-koda-cream rounded-xl p-6 pb-8 border border-koda-line shadow-[0_8px_30px_rgba(0,0,0,.6)]">
      <div class="mb-4">
        <label class="micro-label block text-xs font-medium text-koda-mute mb-2">PIN Code</label>
        <div class="relative">
          <input
            type="password"
            id="pin-input"
            maxlength="10"
            class="w-full bg-koda-panel border border-koda-line text-koda-cream rounded-lg px-4 py-3 text-center text-xl tracking-widest focus:outline-none focus:border-koda-gold focus:ring-1 focus:ring-koda-gold transition-colors"
            placeholder="••••"
            autocomplete="off"
          >
          <button type="button" onclick="togglePinVisibility()" class="absolute right-3 top-1/2 -translate-y-1/2 text-koda-mute hover:text-koda-gold">
            <span id="eye-icon" class="text-xs font-semibold uppercase tracking-wider">Show</span>
          </button>
        </div>
      </div>

      <div id="error-message" class="hidden mb-4 p-3 bg-koda-red/10 border border-koda-red/40 rounded-lg text-koda-red text-sm text-center font-medium">
        Invalid PIN code
      </div>

      <button
        type="submit"
        id="login-button"
        class="w-full bg-koda-gold hover:brightness-110 text-koda-ink font-semibold py-3 rounded-lg transition-all flex items-center justify-center gap-2 disabled:opacity-50 disabled:cursor-not-allowed"
      >
        <span>Sign In</span>
      </button>
    </form>

    <div class="mt-6 text-center text-xs text-koda-mute micro-label">
      <p>Secure Operations Environment</p>
      <p class="mt-1">Authorized personnel only</p>
    </div>
  </div>

  <script>
    function togglePinVisibility() {
      const input = document.getElementById('pin-input');
      const icon = document.getElementById('eye-icon');
      
      if (input.type === 'password') {
        input.type = 'text';
        icon.textContent = 'Hide';
      } else {
        input.type = 'password';
        icon.textContent = 'Show';
      }
    }

    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const pinInput = document.getElementById('pin-input');
      const pin = pinInput.value.trim();
      const button = document.getElementById('login-button');
      const errorMessage = document.getElementById('error-message');
      const form = document.getElementById('login-form');
      
      // Clear previous errors
      errorMessage.classList.add('hidden');
      form.classList.remove('shake');
      
      if (!pin) {
        errorMessage.textContent = 'Please enter your PIN';
        errorMessage.classList.remove('hidden');
        form.classList.add('shake');
        setTimeout(() => form.classList.remove('shake'), 500);
        pinInput.focus();
        return;
      }
      
      button.disabled = true;
      button.innerHTML = '<span>Signing in...</span>';

      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ pin })
        });

        let data;
        try {
          data = await res.json();
        } catch {
          throw new Error('Server error — please try again');
        }

        if (res.ok && data.success) {
          // Redirect based on role returned from server
          const role = data.data?.role;
          let redirectTarget = '/';
          if (role === 'transport') redirectTarget = '/';
          if (role === 'storage') redirectTarget = '/storage';
          window.location.href = redirectTarget;
        } else if (res.status === 401) {
          throw new Error('Invalid PIN — please try again');
        } else {
          throw new Error(data.error || 'Login failed — please try again');
        }
      } catch (err) {
        const message = err instanceof Error ? err.message : 'Something went wrong';
        errorMessage.textContent = message;
        errorMessage.classList.remove('hidden');
        form.classList.add('shake');
        setTimeout(() => form.classList.remove('shake'), 500);
        
        // Clear PIN and refocus for retry
        pinInput.value = '';
        pinInput.focus();
        
        button.disabled = false;
        button.innerHTML = '<span>Sign In</span>';
      }
    });

    // Focus input on load
    document.getElementById('pin-input').focus();
  </script>
</body>
</html>
