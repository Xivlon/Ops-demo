<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Loading - LuggageLink Ops</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #0f172a;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .loader-container {
      width: 100%;
      max-width: 480px;
      position: relative;
      display: flex;
      flex-direction: column;
    }

    .animation-wrapper {
      width: 100%;
      height: 320px;
      border: 2px solid #22c55e;
      border-radius: 12px;
      overflow: hidden;
      position: relative;
    }

    /* Sky Layer */
    .sky-layer {
      height: 30%;
      position: relative;
      overflow: hidden;
      background: transparent;
      border-radius: 12px 12px 0 0;
    }

    .cloud {
      position: absolute;
      opacity: 0.3;
    }

    .cloud svg {
      width: 80px;
      height: 80px;
      fill: #64748b;
    }

    .cloud-1 {
      top: 8%;
      left: 10%;
      animation: cloudBob 4s ease-in-out infinite;
    }

    .cloud-2 {
      top: 3%;
      left: 45%;
      animation: cloudBob 5s ease-in-out infinite;
      animation-delay: -1.5s;
    }

    .cloud-3 {
      top: 5%;
      left: 75%;
      animation: cloudBob 4.5s ease-in-out infinite;
      animation-delay: -3s;
    }

    @keyframes cloudBob {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-5px); }
    }

    .plane-wrapper {
      position: absolute;
      top: 50%;
      left: -100px;
      transform: translateY(-50%);
      animation: flyAcross 10s ease-in-out infinite;
    }

    .plane-wrapper svg,
    .plane-wrapper svg path {
      width: 60px;
      height: 60px;
      fill: #8b5cf6 !important;
      stroke: none;
    }

    @keyframes flyAcross {
      0% {
        left: -100px;
        transform: translateY(-50%) rotate(-1deg);
      }
      25% {
        transform: translateY(-55%) rotate(0deg);
      }
      50% {
        transform: translateY(-50%) rotate(1deg);
      }
      75% {
        transform: translateY(-48%) rotate(0deg);
      }
      100% {
        left: calc(100% + 100px);
        transform: translateY(-50%) rotate(1deg);
      }
    }



    /* Ocean Layer */
    .ocean-layer {
      height: 35%;
      position: relative;
      overflow: hidden;
      background: transparent;
    }

    .sea-scene {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: flex-end;
      animation: seaScroll 60s linear infinite;
      animation-delay: -1s;
    }

    .sea-scene svg.wave {
      width: 28px;
      height: 24px;
      stroke: #22d3ee;
      stroke-width: 2.5;
      fill: none;
      flex-shrink: 0;
    }

    .sea-scene svg.boat-svg {
      width: 100px;
      height: 80px;
      fill: #22d3ee;
      stroke: #22d3ee;
      stroke-width: 2;
      flex-shrink: 0;
      margin-bottom: -18px;
    }

    @keyframes seaScroll {
      from { transform: translateX(-2740px); }
      to { transform: translateX(-548px); }
    }

    /* Road Layer */
    .road-layer {
      height: 35%;
      position: relative;
      overflow: hidden;
      background: transparent;
      border-radius: 0 0 12px 12px;
    }

    .road-line-container {
      position: absolute;
      top: 50%;
      left: 0;
      width: 200%;
      height: 20px;
      transform: translateY(-50%);
      display: flex;
      gap: 50px;
      animation: roadScroll 3s linear infinite;
    }

    .road-line-container svg {
      width: 50px;
      height: 10px;
      fill: #64748b;
      opacity: 0.5;
    }

    @keyframes roadScroll {
      from { transform: translateY(-50%) translateX(0); }
      to { transform: translateY(-50%) translateX(-100px); }
    }

    .car-wrapper {
      position: absolute;
      top: 45%;
      left: -120px;
      transform: translateY(-50%);
      animation: drive 15s ease-in-out infinite;
    }

    .car-wrapper svg {
      width: 80px;
      height: 80px;
      fill: #10b981;
    }

    @keyframes drive {
      0% {
        left: -120px;
        transform: translateY(-50%) translateY(0);
      }
      15% {
        transform: translateY(-50%) translateY(-2px);
      }
      30% {
        transform: translateY(-50%) translateY(0);
      }
      50% {
        transform: translateY(-50%) translateY(-1px);
      }
      70% {
        transform: translateY(-50%) translateY(-1px);
      }
      100% {
        left: calc(100% + 120px);
        transform: translateY(-50%) translateY(0);
      }
    }

    /* Exhaust puffs from car */
    .exhaust {
      position: absolute;
      top: 65%;
      left: -20px;
    }

    .puff {
      position: absolute;
      width: 8px;
      height: 8px;
      background: rgba(100, 116, 139, 0.4);
      border-radius: 50%;
      animation: puffFade 1.5s ease-out infinite;
    }

    .puff:nth-child(1) { animation-delay: 0s; }
    .puff:nth-child(2) { animation-delay: 0.5s; }
    .puff:nth-child(3) { animation-delay: 1s; }

    @keyframes puffFade {
      0% {
        transform: translateX(0) scale(1);
        opacity: 0.3;
      }
      100% {
        transform: translateX(-30px) scale(1.5);
        opacity: 0;
      }
    }

    /* Brand Section */
    .brand-section {
      text-align: center;
      margin-top: 40px;
    }

    .brand-title {
      font-size: 1.5rem;
      font-weight: 700;
      color: #f1f5f9;
      letter-spacing: -0.02em;
      margin-bottom: 16px;
    }

    .loading-dots {
      display: flex;
      justify-content: center;
      gap: 8px;
    }

    .dot {
      width: 8px;
      height: 8px;
      background: #8b5cf6;
      border-radius: 50%;
      animation: dotPulse 1.4s ease-in-out infinite both;
    }

    .dot:nth-child(1) { animation-delay: 0s; }
    .dot:nth-child(2) { animation-delay: 0.2s; }
    .dot:nth-child(3) { animation-delay: 0.4s; }

    @keyframes dotPulse {
      0%, 80%, 100% {
        opacity: 0.3;
        transform: scale(0.8);
      }
      40% {
        opacity: 1;
        transform: scale(1);
      }
    }

    /* Reduced motion */
    @media (prefers-reduced-motion: reduce) {
      .cloud,
      .plane-wrapper,
      .wave-container,
      .boat-wrapper,
      .wake-ripple,
      .road-line-container,
      .car-wrapper,
      .puff,
      .dot {
        animation: none;
      }

      .plane-wrapper {
        left: 50%;
        transform: translate(-50%, -50%);
      }

      .boat-wrapper {
        animation: none;
        transform: translate(-50%, -50%);
      }

      .car-wrapper {
        left: 50%;
        transform: translate(-50%, -50%);
      }
    }

    /* Responsive */
    @media (max-width: 768px) {
      .loader-container {
        height: 300px;
        margin: 0 20px;
      }

      .sky-layer,
      .ocean-layer,
      .road-layer {
        border-radius: 8px;
        margin-bottom: 4px;
      }

      .plane-wrapper svg {
        width: 45px;
        height: 45px;
      }

      .boat-wrapper svg {
        width: 80px;
        height: 80px;
      }

      .car-wrapper svg {
        width: 60px;
        height: 60px;
      }

      .cloud svg {
        width: 50px;
        height: 50px;
      }

      .brand-title {
        font-size: 1.25rem;
      }
    }

    /* Fade out animation for transition */
    .fade-out {
      animation: fadeOut 0.5s ease-out forwards;
    }

    @keyframes fadeOut {
      to {
        opacity: 0;
        transform: scale(0.98);
      }
    }
  </style>
</head>

          <path d="M26,50.5c0,1.104,0.896,2,2,2h44c1.104,0,2-0.896,2-2s-0.896-2-2-2H28C26.896,48.5,26,49.396,26,50.5z"/>
        </svg>
      </div>
    </div>
    </div>

    <!-- Brand Section -->
    <div class="brand-section">
      <h1 class="brand-title">LuggageLink Ops</h1>
      <div class="loading-dots" aria-label="Loading">
        <span class="dot"></span>
        <span class="dot"></span>
        <span class="dot"></span>
      </div>
    </div>
  </div>

  <script>
    // Handle transition out
    window.addEventListener('load', () => {
      // Minimum display time of 2.5 seconds
      setTimeout(() => {
        // Check if there's a callback or redirect needed
        const redirectUrl = new URLSearchParams(window.location.search).get('redirect');
        if (redirectUrl) {
          document.getElementById('loader').classList.add('fade-out');
          setTimeout(() => {
            window.location.href = redirectUrl;
          }, 500);
        }
      }, 2500);
    });

    // Timeout protection - show message if stuck
    setTimeout(() => {
      const brandTitle = document.querySelector('.brand-title');
      if (brandTitle && !document.getElementById('loader').classList.contains('fade-out')) {
        brandTitle.textContent = 'Still loading...';
      }
    }, 10000);
  </script>
</body>
</html>
