# Main Operations Console Worker

name = 'luggster-ops'
main = 'src/index.ts'
compatibility_date = '2024-01-01'
compatibility_flags = ['nodejs_compat']

# Logs
[observability]
[observability.logs]
enabled = true
invocation_logs = true

# Non-sensitive environment variables
[vars]
JWT_EXPIRY_HOURS = '24'

# SECURITY: Secrets must be set via:
#   wrangler secret put DATABASE_URL
#   wrangler secret put JWT_SECRET
#   wrangler secret put ROLES
#   wrangler secret put PIN_PEPPER  # Optional but strongly recommended for PIN hashing
#
# For local development, create a .dev.vars file (already gitignored):
#   DATABASE_URL=postgresql://...
#   JWT_SECRET=...
#   ROLES={"admin":"...","storage":"...","transport":"..."}
#   PIN_PEPPER=your-pepper-here

# Environment-specific configuration
[env.staging]
name = 'luggster-ops-staging'
workers_dev = true

[env.production]
name = 'luggster-ops'
workers_dev = true  # Using workers.dev domain: luggster-ops.constance-api.workers.dev

# For local development/testing
[env.development]
name = 'luggster-ops-dev'
workers_dev = true