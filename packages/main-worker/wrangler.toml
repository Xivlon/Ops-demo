# Main Operations Console Worker

name = 'luggster-ops'
main = 'src/index.ts'
compatibility_date = '2024-01-01'
compatibility_flags = ['nodejs_compat']

# Logs
[observability]
[observability.logs]
enabled = true
invocation_logs = true

# Environment-specific configuration
[env.staging]
name = 'luggster-ops-staging'

[env.production]
name = 'luggster-ops'
workers_dev = false

# Production route
[[routes]]
pattern = 'ops.luggster.com/*'
zone_name = 'luggster.com'

# For local development/testing
[env.development]
name = 'luggster-ops-dev'
workers_dev = true