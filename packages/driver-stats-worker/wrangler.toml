# Driver Statistics Worker

name = 'driver-stats'
main = 'src/index.ts'
compatibility_date = '2024-01-01'
compatibility_flags = ['nodejs_compat']

# Logs
[observability]
[observability.logs]
enabled = true
invocation_logs = true

# Environment-specific configuration
[env.staging]
name = 'driver-stats-staging'

[env.production]
name = 'driver-stats'
workers_dev = true  # Use workers.dev subdomain

# For local development/testing
[env.development]
name = 'driver-stats-dev'
workers_dev = true