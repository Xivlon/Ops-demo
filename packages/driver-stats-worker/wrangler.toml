# Driver Statistics Worker

name = 'driver-stats'
main = 'src/index.ts'
compatibility_date = '2024-01-01'
compatibility_flags = ['nodejs_compat']

# Logs
[observability]
[observability.logs]
enabled = true
invocation_logs = true

# SECURITY: Secrets (DATABASE_URL, JWT_SECRET, ROLES) must be set via:
#   wrangler secret put DATABASE_URL
#   wrangler secret put JWT_SECRET
#   wrangler secret put ROLES
#
# For local development, create a .dev.vars file (already gitignored):
#   DATABASE_URL=postgresql://...
#   JWT_SECRET=...
#   ROLES={"admin":"...","storage":"...","transport":"..."}

# Environment-specific configuration
[env.staging]
name = 'driver-stats-staging'
workers_dev = true

[env.production]
name = 'driver-stats'
workers_dev = true  # Using workers.dev domain: driver-stats.constance-api.workers.dev

# For local development/testing
[env.development]
name = 'driver-stats-dev'
workers_dev = true