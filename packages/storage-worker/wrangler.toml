# Storage Operations Worker

name = 'storage'
main = 'src/index.ts'
compatibility_date = '2024-01-01'
compatibility_flags = ['nodejs_compat']

# Logs
[observability]
[observability.logs]
enabled = true
invocation_logs = true

# SECURITY: Secrets must be set via:
#   wrangler secret put DATABASE_URL
#   wrangler secret put JWT_SECRET
#   wrangler secret put ROLES
#   wrangler secret put PIN_PEPPER  # Optional but strongly recommended for PIN hashing
#
# For local development, create a .dev.vars file (already gitignored):
#   DATABASE_URL=postgresql://...
#   JWT_SECRET=...
#   ROLES={"admin":"...","storage":"...","transport":"..."}
#   PIN_PEPPER=your-pepper-here

# Environment-specific configuration
[env.staging]
name = 'storage-staging'
workers_dev = true

[env.production]
name = 'storage'
workers_dev = true

# For local development/testing
[env.development]
name = 'storage-dev'
workers_dev = true
